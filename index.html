<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExploMonde</title>
</head>
<body>

    <h1>ExploMonde</h1>

      <a href="/pays">Pays</a>

  <main>

        <input type="search" id="recherche-pays" name="recherche-pays">

    <section>
      <h2>Résultats</h2>

      <article>
        <h3>France</h3>
        <p>Capitale : Paris</p>
        <p>Région : Europe</p>
        <p>Population : 67 000 000</p>
      </article>

      <article>
        <h3>Japon</h3>
        <p>Capitale : Tokyo</p>
        <p>Région : Asie</p>
        <p>Population : 125 000 000</p>
      </article>

      <article>
        <h3>Algérie</h3>
        <p>Capitale : Alger</p>
        <p>Région : Afrique</p>
        <p>Population : 44 000 000</p>
      </article>
    </section>
  </main>

  <footer>
    <p>Projet ExploMonde — TP fil rouge</p>
  </footer>

</html>
